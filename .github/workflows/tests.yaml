name: Tests

on:
    push:
    pull_request:
        branches: [ '*.x' ]
    workflow_dispatch:
    schedule:
        -   cron: '0 8 * * *'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    phpunit:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: [ '8.1', '8.2', '8.3', '8.4', '8.5' ]
                symfony: [ '6.4', '7.4', '8.0', '8.1' ]
                dependencies: [ 'highest', 'lowest' ]
                exclude:
                    -   php: '8.1'
                        symfony: '7.4'
                    -   php: '8.1'
                        symfony: '8.0'
                    -   php: '8.2'
                        symfony: '8.0'
                    -   php: '8.3'
                        symfony: '8.0'
                    -   php: '8.1'
                        symfony: '8.1'
                    -   php: '8.2'
                        symfony: '8.1'
                    -   php: '8.3'
                        symfony: '8.1'
        services:
            postgres:
                image: postgres:17
                env:
                    POSTGRES_DB: purgatory
                    POSTGRES_PASSWORD: password
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 3
        env:
            SYMFONY_REQUIRE: ${{ matrix.symfony }}.*
        name: PHP ${{ matrix.php }} & Symfony ${{ matrix.symfony }}${{ matrix.dependencies == 'lowest' && ' (lowest)' || '' }} Test
        steps:
            -   name: Checkout
                uses: actions/checkout@v7

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}
                    ini-values: zend.exception_ignore_args=false
                    tools: flex

            -   name: Downgrade PHPUnit for PHP 8.1
                if: matrix.php == '8.1'
                run: |
                    composer require --dev --no-update phpunit/phpunit:^10.5
                    sed -i 's/failOnPhpunitDeprecation="true"//g' phpunit.dist.xml
                    sed -i 's/failOnPhpunitNotice="true"//g' phpunit.dist.xml

            -   name: Downgrade PHPUnit for PHP 8.2
                if: matrix.php == '8.2'
                run: |
                    composer require --dev --no-update phpunit/phpunit:^11.5
                    sed -i 's/failOnPhpunitNotice="true"//g' phpunit.dist.xml

            -   name: Install Dependencies
                uses: ramsey/composer-install@v4
                with:
                    composer-options: '--prefer-dist'
                    dependency-versions: ${{ matrix.dependencies }}

            -   name: Run Tests
                env:
                    DATABASE_URL: 'postgresql://postgres:password@127.0.0.1:5432/purgatory?serverVersion=16'
                run: vendor/bin/phpunit --log-junit=junit.xml --coverage-text --coverage-clover=coverage.xml

            -   name: Publish Test Report
                uses: mikepenz/action-junit-report@v6
                if: always()
                with:
                    annotate_only: true
                    fail_on_failure: true
                    require_tests: true
                    report_paths: ./junit.xml

            -   name: Upload Test Coverage
                if: ${{ success() && (github.event_name == 'pull_request' || vars.UPLOAD_COVERAGE == 'true') }}
                uses: codecov/codecov-action@v7
                with:
                    codecov_yml_path: .github/codecov.yaml
                    fail_ci_if_error: true
                    files: coverage.xml
                    flags: ${{ matrix.php }}
                    token: ${{ secrets.CODECOV_TOKEN }}
